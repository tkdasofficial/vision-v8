name = "vision"
main = "../cloudflare.entry.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

[vars]
VISION_BACKEND_RUNTIME = "cloudflare"
# Exact origins the gateway may send users back to (comma-separated).
ALLOWED_RETURN_ORIGINS = "https://vision.tusharkantidasofficial.workers.dev,https://id-preview--b9303adb-64e8-4985-a8e5-43de9ac3bbd4.lovable.app,https://project--b9303adb-64e8-4985-a8e5-43de9ac3bbd4-dev.lovable.app,https://project--b9303adb-64e8-4985-a8e5-43de9ac3bbd4.lovable.app,https://b9303adb-64e8-4985-a8e5-43de9ac3bbd4.lovableproject.com,http://localhost:8080"

# Secrets (set with `wrangler secret put`, never committed):
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
# STATE_KEY, SIGNING_KEY

# Gmail SMTP credentials from the account Secrets Store (used by POST /mail).
[[secrets_store_secrets]]
binding = "SMTP_EMAIL"
store_id = "b4394e5cddb24a46b6984c69ce02b8b6"
secret_name = "SMTP_EMAIL"

[[secrets_store_secrets]]
binding = "SMTP_PASSWORD"
store_id = "b4394e5cddb24a46b6984c69ce02b8b6"
secret_name = "SMTP_PASSWORD"
# MAIL_TOKEN: Worker secret shared with the app (app env MAIL_TOKEN).

# Existing VISION database: shared by application handlers and runtime relay.
[[d1_databases]]
binding = "DB"
database_name = "vision"
database_id = "ded73090-4d47-45ac-952f-24ae2beaba5f"
